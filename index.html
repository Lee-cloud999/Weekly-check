// v39 duplicate black box — session only, never changes planner records
const dupEventLog=[];
function dupLog(type,detail={}){
  const row={time:new Date().toLocaleTimeString('ko-KR'),type,...detail};
  dupEventLog.push(row); if(dupEventLog.length>80)dupEventLog.shift();
  if(document.getElementById('dupDiag')?.classList.contains('show'))refreshDuplicateDiagnostics();
}
function dupSummary(d){const items=diagItems(d);return {items:items.length,focus:!!(d?.focus||'').trim(),thisweek:!!(d?.thisweek||'').trim(),notes:!!(d?.notes||'').trim()}}

function diagItems(d){const out=[];(d?.days||[]).forEach((tasks,di)=>(tasks||[]).forEach((t,ti)=>{const text=(t?.text||'').trim();if(text)out.push({di,ti,text,status:+t.status||0})}));return out}
function diagDuplicates(items){const m=new Map();items.forEach(t=>{const key=`${t.di}|${t.text.toLowerCase()}|${t.status}`;m.set(key,(m.get(key)||0)+1)});return [...m.entries()].filter(([,n])=>n>1)}
function diagComparable(d){return JSON.stringify(toCloud(d||blankData()))}
async function refreshDuplicateDiagnostics(){
 const box=document.getElementById('dupDiag');if(!box||!box.classList.contains('show'))return;
 const cur=currentWeekKey||weekKey(monday()),base=new Date(cur+'T00:00:00'),weekKeys=[-1,0,1].map(n=>{const d=new Date(base);d.setDate(d.getDate()+n*7);return ymd(d)});
 const remote=new Map();let cloudError='';
 if(currentUser){try{const snap=await getDocs(collection(db,'users',currentUser.uid,'weekly_check'));snap.forEach(x=>remote.set(x.id,fromCloud(x.data())))}catch(e){cloudError=e?.code||e?.message||'조회 오류'}}
 const lines=['WEEKLY CHECK · 복제 진단',`현재 주: ${cur}`,`렌더링 ${dupDiagState.renderCount}회 · 저장 요청 ${dupDiagState.saveCount}회 · Firebase 수신 ${dupDiagState.cloudCount}회`,`마지막 저장 ${dupDiagState.lastSave} · 마지막 수신 ${dupDiagState.lastCloud}`,''];
 for(const k of weekKeys){const local=load(k),li=diagItems(local),ld=diagDuplicates(li);let rc=currentUser?'0':'로그인 필요',rd=currentUser?'0':'-',cmp=currentUser?'서버 기록 없음':'-';if(currentUser&&remote.has(k)){const x=remote.get(k),ri=diagItems(x);rc=String(ri.length);rd=String(diagDuplicates(ri).length);cmp=diagComparable(local)===diagComparable(x)?'같음':'다름 ⚠️'}else if(currentUser&&li.length)cmp='로컬만 있음 ⚠️';lines.push(`${k===cur?'▶':' '} ${k}`);lines.push(`  로컬 ${li.length}개 · Firebase ${rc}개`);lines.push(`  로컬 내부중복 ${ld.length} · 서버 내부중복 ${rd} · 로컬/서버 ${cmp}`)}
 if(cloudError)lines.push(`⚠️ Firebase 진단 조회 오류: ${cloudError}`);
 lines.push('','— 최근 동작 블랙박스 —');
 if(!dupEventLog.length)lines.push('아직 기록된 동작이 없습니다.');
 else dupEventLog.slice(-18).forEach(e=>{
   let extra='';
   if(e.from||e.to)extra+=` ${e.from||'-'} → ${e.to||'-'}`;
   if(e.key)extra+=` key=${e.key}`;
   if(e.items!==undefined)extra+=` 항목=${e.items}`;
   if(e.reason)extra+=` · ${e.reason}`;
   lines.push(`${e.time} · ${e.type}${extra}`);
 });
 lines.push('','※ 진단/블랙박스는 세션 메모리만 사용하며 기록을 수정·삭제하지 않습니다.');box.textContent=lines.join('\\n')
}

async function migrateAndPull(user){setSync('처음 동기화 중…');const col=collection(db,'users',user.uid,'weekly_check');const snap=await getDocs(col),remote=new Map();snap.forEach(d=>remote.set(d.id,d.data()));for(const k of Object.keys(localStorage).filter(k=>k.startsWith(KEY))){let wk=k.slice(KEY.length);if(!remote.has(wk)){let d=load(wk);if(hasContent(d))await setDoc(doc(col,wk),{...toCloud(d),deviceUpdatedAt:Date.now(),updatedAt:serverTimestamp()})}}const s2=await getDocs(col);remoteApplying=true;s2.forEach(x=>{let d=fromCloud(x.data());localSet(x.id,d)});remoteApplying=false;render();setSync('동기화됨',true)}
function listenCloud(user){if(unsubscribeCloud)unsubscribeCloud();unsubscribeCloud=onSnapshot(collection(db,'users',user.uid,'weekly_check'),{includeMetadataChanges:true},snap=>{dupDiagState.cloudCount++;dupDiagState.lastCloud=new Date().toLocaleTimeString('ko-KR');remoteApplying=true;snap.docChanges().forEach(ch=>{let d=fromCloud(ch.doc.data());dupLog('Firebase 수신',{key:ch.doc.id,...dupSummary(d),reason:ch.type});if(ch.type==='removed')localStorage.removeItem(KEY+ch.doc.id);else localSet(ch.doc.id,d)});remoteApplying=false;if(document.getElementById('archive').classList.contains('active'))renderArchive();else if(isEditing||document.activeElement?.matches('input,textarea'))pendingCloudRender=true;else render();setSync(snap.metadata.fromCache?'연결 확인 중…':'동기화됨',!snap.metadata.fromCache)},e=>{console.error('Firestore listen error',e);showFirebaseError('실시간 수신(onSnapshot)',e);setSync(navigator.onLine?'동기화 오류 · 기기에 저장됨':'오프라인 · 기기에 저장됨')})}
