<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weekly Check</title><meta name="theme-color" content="#f6f5f2"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;padding:18px 16px 76px}.eyebrow{text-align:center;font:600 11px Georgia,serif;letter-spacing:3px;color:#999}.title{text-align:center;font:500 27px Georgia,serif;letter-spacing:2px;margin:5px 0 10px}.rule{height:1px;background:#222;margin-bottom:12px}.weeknav{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;margin-bottom:10px}.arrow{border:0;background:transparent;font-size:28px;color:#777}.range{text-align:center;font-size:14px;font-weight:650}.focus{border:1px solid #ddd;border-radius:11px;padding:9px 11px;margin-bottom:10px}.focus label{display:block;font:600 9px Georgia,serif;letter-spacing:1.5px;color:#999;margin-bottom:3px}.focus input{width:100%;border:0;outline:0;font-size:14px;background:transparent}.week{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #d8d8d8;border-left:1px solid #d8d8d8}.day{min-height:116px;border-right:1px solid #d8d8d8;border-bottom:1px solid #d8d8d8;padding:8px 8px 6px;position:relative}.day.today{background:#fffaf0}.day.sun{grid-column:1/3;min-height:94px}.dayhead{display:flex;align-items:center;gap:5px;margin-bottom:5px}.dow{font:600 12px Georgia,serif;letter-spacing:1.1px}.date{font-size:10px;color:#999;position:relative;top:2px}.badge{font-size:8px;background:#ead9b7;border-radius:10px;padding:2px 5px;color:#765f36}.task{display:flex;align-items:center;gap:5px;margin:4px 0}.check{width:15px;height:15px;border:1px solid #bcbcbc;border-radius:4px;flex:none;background:#fff;padding:0;display:grid;place-items:center;font:bold 10px/1 Arial,sans-serif;color:#fff}.check.done{background:#486b52;border-color:#486b52;color:#fff}.check.undone{background:#fff;border-color:#777;color:#666;font-size:12px}.task input{min-width:0;width:100%;border:0;border-bottom:1px dotted #ddd;outline:0;font:500 11px Georgia,"Times New Roman",serif;letter-spacing:.2px;padding:2px 0;background:transparent}.task.done input{text-decoration:line-through;color:#999}.task.undone input{color:#777}.add{position:absolute;right:7px;bottom:4px;border:0;background:transparent;color:#aaa;font-size:19px}.bottom{display:grid;grid-template-columns:1fr 1fr;border:1px solid #d8d8d8;border-top:0}.panel{min-height:100px;padding:9px}.panel:first-child{border-right:1px solid #d8d8d8}.panel h3,.archive h3{font:600 9px Georgia,serif;letter-spacing:1.2px;margin:0 0 6px;color:#777}.lined{width:100%;height:72px;border:0;outline:0;resize:none;line-height:22px;font-size:11px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 21px,#e3e3e3 22px)}.footer{text-align:center;font:600 9px Georgia,serif;letter-spacing:2px;color:#aaa;margin-top:12px}.archive{display:none}.archive.active{display:block}.planner.hidden{display:none}.filters{display:flex;gap:7px;margin:8px 0 14px}.filter{border:1px solid #d5d5d5;background:#fff;border-radius:18px;padding:7px 12px;font-size:11px;color:#666}.filter.active{background:#486b52;border-color:#486b52;color:#fff}.record{border-bottom:1px solid #eee;padding:10px 2px}.record-date{font-size:11px;font-weight:700;color:#555;margin-bottom:5px}.record-task{display:flex;gap:8px;align-items:center;font-size:12px;padding:4px 0}.mini{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;font:bold 9px Arial;color:#fff;background:#486b52}.mini.undone{background:#fff;border:1px solid #777;color:#666;font-size:11px}.empty{text-align:center;color:#aaa;font-size:12px;padding:42px 0}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);height:60px;background:rgba(255,255,255,.97);border-top:1px solid #e2e2e2;display:grid;grid-template-columns:1fr 1fr;z-index:20;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:transparent;color:#999;font-size:11px}.nav button.active{color:#486b52;font-weight:700}.nav b{display:block;font-size:18px;margin-bottom:2px}.archive-title{text-align:center;font:500 22px Georgia,serif;letter-spacing:1px;margin:6px 0 3px}.archive-sub{text-align:center;font-size:11px;color:#999;margin-bottom:12px}@media(max-width:370px){.app{padding-left:10px;padding-right:10px}.day{min-height:108px;padding:7px 6px}.task input{font-size:10px}}

.syncbar{display:flex;justify-content:flex-end;align-items:center;gap:7px;margin:0 0 9px;font-size:10px;color:#999}.syncdot{width:7px;height:7px;border-radius:50%;background:#bbb}.syncdot.online{background:#486b52}.account-btn{border:1px solid #ddd;background:#fff;border-radius:999px;padding:5px 9px;font:10px inherit;color:#666}.account-sheet{display:none;position:fixed;inset:0;background:rgba(30,28,24,.25);z-index:80;align-items:flex-end;justify-content:center}.account-sheet.show{display:flex}.account-panel{width:min(520px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 35px rgba(30,25,20,.12)}.account-panel h3{margin:0 0 6px;font-size:18px}.account-panel p{margin:0 0 14px;color:#888;font-size:12px;line-height:1.55}.auth-input{width:100%;border:1px solid #ddd;background:#fff;border-radius:12px;padding:12px 13px;margin:5px 0;font:14px inherit;outline:none}.auth-actions,.backup-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.auth-actions button,.backup-actions button{border:1px solid #d9d4ca;background:#fff;border-radius:999px;padding:9px 13px;font:12px inherit;color:#555}.auth-actions .primary{background:#486b52;color:#fff;border-color:#486b52}.account-close{float:right;border:0;background:transparent;font-size:25px;color:#888}.account-user{padding:12px 0 14px;border-bottom:1px solid #eee;margin-bottom:14px}.auth-msg{min-height:18px;margin-top:8px!important;color:#8d625d!important}.hidden-auth{display:none!important}
</style></head><body><main class="app">
<section class="planner" id="planner"><div class="syncbar"><span class="syncdot" id="syncDot"></span><span id="syncText">이 기기에 저장됨</span><button class="account-btn" id="accountBtn">계정 · 백업</button></div><div class="eyebrow">WEEKLY PLANNER</div><div class="title">WEEKLY CHECK</div><div class="rule"></div><div class="weeknav"><button class="arrow" id="prev">‹</button><div class="range" id="range"></div><button class="arrow" id="next">›</button></div><div class="focus"><label>THIS WEEK'S FOCUS</label><input id="focus" placeholder="이번 주 가장 중요한 한 가지"></div><section class="week" id="week"></section><section class="bottom"><div class="panel"><h3>THIS WEEK</h3><textarea id="thisweek" class="lined" placeholder="이번 주 할 일"></textarea></div><div class="panel"><h3>NOTES</h3><textarea id="notes" class="lined" placeholder="메모"></textarea></div></section><div class="footer">A WEEK AT A GLANCE</div></section>
<section class="archive" id="archive"><div class="eyebrow">WEEKLY PLANNER</div><div class="archive-title">ARCHIVE</div><div class="archive-sub">완료한 일과 미완성한 일을 모아봅니다.</div><div class="rule"></div><div class="filters"><button class="filter active" data-filter="all">전체</button><button class="filter" data-filter="done">한 일</button><button class="filter" data-filter="undone">미완성</button></div><div id="records"></div></section>
</main><div class="account-sheet" id="accountSheet" aria-hidden="true"><section class="account-panel"><button class="account-close" id="accountClose" aria-label="닫기">×</button><h3>동기화 · 백업</h3><p>같은 계정으로 로그인하면 PC, iPad, 휴대폰에서 같은 주간 계획을 사용할 수 있어요. 로그인하지 않아도 이 기기에는 계속 저장됩니다.</p><div id="signedOutBox"><input class="auth-input" id="authEmail" type="email" autocomplete="email" placeholder="이메일"><input class="auth-input" id="authPassword" type="password" autocomplete="current-password" placeholder="비밀번호"><div class="auth-actions"><button class="primary" id="loginBtn">로그인</button><button id="signupBtn">새 계정 만들기</button></div></div><div id="signedInBox" class="hidden-auth"><div class="account-user"><b id="userEmail"></b><p style="margin-top:5px">Firebase에 자동 동기화 중</p></div><div class="backup-actions"><button id="backupBtn">지금 백업</button><button id="restoreBtn">최근 백업 복원</button><button id="logoutBtn">로그아웃</button></div></div><p class="auth-msg" id="authMsg"></p>
<div id="firebaseDiag" style="display:none;margin-top:12px;padding:11px 12px;border:1px solid #e2d8d2;border-radius:12px;background:#fffaf7;font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#765f58;white-space:pre-wrap;word-break:break-word"></div></section></div><nav class="nav"><button id="navWeek" class="active"><b>□</b>이번 주</button><button id="navArchive"><b>≡</b>보관함</button></nav>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,setPersistence,browserLocalPersistence } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import { initializeFirestore,collection,doc,getDocs,setDoc,deleteDoc,onSnapshot,serverTimestamp,query,orderBy,limit,persistentLocalCache,persistentSingleTabManager } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCOy8x5kPeJUUqRUjEHRqckT2ReULEoUac",authDomain:"maeum-jogak2.firebaseapp.com",projectId:"maeum-jogak2",storageBucket:"maeum-jogak2.firebasestorage.app",messagingSenderId:"942972843404",appId:"1:942972843404:web:f4102731556db95309d2a9",measurementId:"G-76KT3H2BGQ"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});
const db=initializeFirestore(app,{
  experimentalAutoDetectLongPolling:true,
  localCache:persistentLocalCache({tabManager:persistentSingleTabManager({forceOwnership:false})})
});
const names=['월','화','수','목','금','토','일'],KEY='weekly-check-v3-',VIEW='weekly-check-current-view';let offset=0,filter='all',currentWeekKey='',currentUser=null,unsubscribeCloud=null,saveTimer=null,remoteApplying=false;
function pad(n){return String(n).padStart(2,'0')} function ymd(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function monday(){let d=new Date();d.setHours(0,0,0,0);let n=d.getDay()||7;d.setDate(d.getDate()-n+1+offset*7);return d} function weekKey(d){return ymd(d)}
function blankTasks(){return [{text:'',status:0},{text:'',status:0},{text:'',status:0}]}
function blankData(){return {focus:'',thisweek:'',notes:'',days:Array.from({length:7},blankTasks)}}
function load(k){try{return JSON.parse(localStorage.getItem(KEY+k))||blankData()}catch(e){return blankData()}}
function hasContent(d){return !!((d.focus||'').trim()||(d.thisweek||'').trim()||(d.notes||'').trim()||(d.days||[]).some(a=>(a||[]).some(t=>(t.text||'').trim()||t.status)))}
function localSet(k,d){if(hasContent(d))localStorage.setItem(KEY+k,JSON.stringify(d));else localStorage.removeItem(KEY+k)}
function collect(){let data=load(currentWeekKey);data.focus=document.getElementById('focus').value;data.thisweek=document.getElementById('thisweek').value;data.notes=document.getElementById('notes').value;data.days=[];document.querySelectorAll('.day').forEach(day=>{let arr=[];day.querySelectorAll('.task').forEach(t=>arr.push({text:t.querySelector('input').value,status:+t.dataset.status||0}));data.days.push(arr)});return data}
function setSync(text,online=false){document.getElementById('syncText').textContent=text;document.getElementById('syncDot').classList.toggle('online',online)}
async function cloudSave(k,d){if(!currentUser||remoteApplying)return;setSync('동기화 중…');try{let r=doc(db,'users',currentUser.uid,'weekly_check',k);if(hasContent(d))await setDoc(r,{...d,deviceUpdatedAt:Date.now(),updatedAt:serverTimestamp()});else await deleteDoc(r);setSync('동기화됨',true)}catch(e){console.error('Firestore save error',e);showFirebaseError('저장(setDoc/deleteDoc)',e);setSync(navigator.onLine?'동기화 오류 · 기기에 저장됨':'오프라인 · 기기에 저장됨')}}
function save(){if(!currentWeekKey)return;let d=collect();localSet(currentWeekKey,d);clearTimeout(saveTimer);saveTimer=setTimeout(()=>cloudSave(currentWeekKey,d),350)}
function render(){let m=monday(),end=new Date(m);end.setDate(m.getDate()+6);currentWeekKey=weekKey(m);let data=load(currentWeekKey);document.getElementById('range').textContent=`${m.getMonth()+1}.${m.getDate()} — ${end.getMonth()+1}.${end.getDate()}`;document.getElementById('focus').value=data.focus||'';document.getElementById('thisweek').value=data.thisweek||'';document.getElementById('notes').value=data.notes||'';let today=ymd(new Date()),html='';for(let i=0;i<7;i++){let d=new Date(m);d.setDate(m.getDate()+i);let is=ymd(d)===today,tasks=(data.days&&data.days[i])||blankTasks();html+=`<div class="day ${is?'today':''} ${i===6?'sun':''}" data-i="${i}"><div class="dayhead"><span class="dow">${names[i]}</span><span class="date">${d.getMonth()+1}.${d.getDate()}</span>${is?'<span class="badge">TODAY</span>':''}</div><div class="tasks">${tasks.map(taskRow).join('')}</div><button class="add">＋</button></div>`}document.getElementById('week').innerHTML=html;bind()}
function taskRow(t={text:'',status:0}){let c=t.status===1?'done':t.status===2?'undone':'';return `<div class="task ${c}" data-status="${t.status||0}"><button class="check ${c}">${t.status===1?'✓':t.status===2?'−':''}</button><input value="${esc(t.text||'')}"></div>`}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function bind(){document.querySelectorAll('.add').forEach(b=>b.onclick=()=>{let box=b.parentElement.querySelector('.tasks');box.insertAdjacentHTML('beforeend',taskRow());bind();box.lastElementChild.querySelector('input').focus();save()});document.querySelectorAll('.check').forEach(b=>b.onclick=()=>{let t=b.closest('.task'),st=(+t.dataset.status+1)%3;t.dataset.status=st;t.className='task '+(st===1?'done':st===2?'undone':'');b.className='check '+(st===1?'done':st===2?'undone':'');b.textContent=st===1?'✓':st===2?'−':'';save()});document.querySelectorAll('.task input').forEach(i=>i.oninput=save)}
['focus','thisweek','notes'].forEach(id=>document.getElementById(id).addEventListener('input',save));document.getElementById('prev').onclick=()=>{save();offset--;render()};document.getElementById('next').onclick=()=>{save();offset++;render()};
function archiveData(){let out=[];for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(!k.startsWith(KEY))continue;let wk=k.slice(KEY.length),d=load(wk);(d.days||[]).forEach((tasks,di)=>(tasks||[]).forEach(t=>{if(t.text&&t.status>0){let date=new Date(wk+'T00:00:00');date.setDate(date.getDate()+di);out.push({date:ymd(date),text:t.text,status:t.status})}}))}return out.sort((a,b)=>b.date.localeCompare(a.date))}
function renderArchive(){let rows=archiveData().filter(x=>filter==='all'||(filter==='done'&&x.status===1)||(filter==='undone'&&x.status===2)),box=document.getElementById('records');if(!rows.length){box.innerHTML='<div class="empty">아직 해당 기록이 없어요.</div>';return}let groups={};rows.forEach(r=>(groups[r.date]??=[]).push(r));box.innerHTML=Object.entries(groups).map(([date,items])=>`<div class="record"><div class="record-date">${date}</div>${items.map(x=>`<div class="record-task"><span class="mini ${x.status===2?'undone':''}">${x.status===1?'✓':'−'}</span><span>${esc(x.text)}</span></div>`).join('')}</div>`).join('')}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderArchive()});function show(which){save();sessionStorage.setItem(VIEW,which);document.getElementById('planner').classList.toggle('hidden',which!=='week');document.getElementById('archive').classList.toggle('active',which==='archive');document.getElementById('navWeek').classList.toggle('active',which==='week');document.getElementById('navArchive').classList.toggle('active',which==='archive');if(which==='archive')renderArchive()}
document.getElementById('navWeek').onclick=()=>show('week');document.getElementById('navArchive').onclick=()=>show('archive');
// account / cloud
const sheet=document.getElementById('accountSheet'),msg=document.getElementById('authMsg');document.getElementById('accountBtn').onclick=()=>{sheet.classList.add('show');sheet.setAttribute('aria-hidden','false')};document.getElementById('accountClose').onclick=()=>{sheet.classList.remove('show');msg.textContent=''};sheet.onclick=e=>{if(e.target===sheet){sheet.classList.remove('show');msg.textContent=''}};
function showFirebaseError(stage,e){
  const box=document.getElementById('firebaseDiag');
  if(!box)return;
  const code=e?.code||'unknown';
  const message=e?.message||String(e||'알 수 없는 오류');
  box.style.display='block';
  box.textContent=`Firebase 진단\n단계: ${stage}\n코드: ${code}\n메시지: ${message}`;
  msg.textContent=`동기화 오류: ${code}`;
}
function clearFirebaseError(){
  const box=document.getElementById('firebaseDiag');
  if(box){box.style.display='none';box.textContent=''}
}
function authError(e){let c=e?.code||'';if(c.includes('invalid-credential'))return '이메일 또는 비밀번호를 확인해주세요.';if(c.includes('email-already-in-use'))return '이미 사용 중인 이메일이에요.';if(c.includes('weak-password'))return '비밀번호는 6자 이상으로 만들어주세요.';if(c.includes('invalid-email'))return '이메일 형식을 확인해주세요.';return '처리하지 못했어요. 잠시 후 다시 시도해주세요.'}
document.getElementById('loginBtn').onclick=async()=>{msg.textContent='로그인 중…';try{await signInWithEmailAndPassword(auth,document.getElementById('authEmail').value.trim(),document.getElementById('authPassword').value);msg.textContent=''}catch(e){msg.textContent=authError(e)}};document.getElementById('signupBtn').onclick=async()=>{msg.textContent='계정 만드는 중…';try{await createUserWithEmailAndPassword(auth,document.getElementById('authEmail').value.trim(),document.getElementById('authPassword').value);msg.textContent='계정을 만들었어요.'}catch(e){msg.textContent=authError(e)}};document.getElementById('logoutBtn').onclick=()=>signOut(auth);
async function migrateAndPull(user){setSync('처음 동기화 중…');const col=collection(db,'users',user.uid,'weekly_check');const snap=await getDocs(col),remote=new Map();snap.forEach(d=>remote.set(d.id,d.data()));for(const k of Object.keys(localStorage).filter(k=>k.startsWith(KEY))){let wk=k.slice(KEY.length);if(!remote.has(wk)){let d=load(wk);if(hasContent(d))await setDoc(doc(col,wk),{...d,deviceUpdatedAt:Date.now(),updatedAt:serverTimestamp()})}}const s2=await getDocs(col);remoteApplying=true;s2.forEach(x=>{let d=x.data();delete d.updatedAt;delete d.deviceUpdatedAt;localSet(x.id,d)});remoteApplying=false;render();setSync('동기화됨',true)}
function listenCloud(user){if(unsubscribeCloud)unsubscribeCloud();unsubscribeCloud=onSnapshot(collection(db,'users',user.uid,'weekly_check'),{includeMetadataChanges:true},snap=>{remoteApplying=true;snap.docChanges().forEach(ch=>{let d=ch.doc.data();delete d.updatedAt;delete d.deviceUpdatedAt;if(ch.type==='removed')localStorage.removeItem(KEY+ch.doc.id);else localSet(ch.doc.id,d)});remoteApplying=false;if(document.getElementById('archive').classList.contains('active'))renderArchive();else render();setSync(snap.metadata.fromCache?'연결 확인 중…':'동기화됨',!snap.metadata.fromCache)},e=>{console.error('Firestore listen error',e);showFirebaseError('실시간 수신(onSnapshot)',e);setSync(navigator.onLine?'동기화 오류 · 기기에 저장됨':'오프라인 · 기기에 저장됨')})}
onAuthStateChanged(auth,async user=>{currentUser=user;document.getElementById('signedOutBox').classList.toggle('hidden-auth',!!user);document.getElementById('signedInBox').classList.toggle('hidden-auth',!user);document.getElementById('userEmail').textContent=user?.email||'';if(user){try{clearFirebaseError();await migrateAndPull(user);listenCloud(user)}catch(e){console.error('Firestore initial sync error',e);showFirebaseError('초기 동기화(getDocs/setDoc)',e);setSync(navigator.onLine?'동기화 오류 · 기기에 저장됨':'오프라인 · 기기에 저장됨')}}else{if(unsubscribeCloud){unsubscribeCloud();unsubscribeCloud=null}setSync('이 기기에 저장됨')}});
function allLocal(){let o={};Object.keys(localStorage).filter(k=>k.startsWith(KEY)).forEach(k=>{let d=load(k.slice(KEY.length));if(hasContent(d))o[k.slice(KEY.length)]=d});return o}
document.getElementById('backupBtn').onclick=async()=>{if(!currentUser)return;msg.textContent='백업 중…';try{let records=allLocal(),id=new Date().toISOString().replace(/[:.]/g,'-');await setDoc(doc(db,'users',currentUser.uid,'weekly_check_backups',id),{createdAt:serverTimestamp(),deviceCreatedAt:Date.now(),records});msg.textContent=`백업 완료 · ${Object.keys(records).length}주 기록`}catch(e){msg.textContent='백업하지 못했어요.'}};
document.getElementById('restoreBtn').onclick=async()=>{if(!currentUser)return;if(!confirm('가장 최근 백업을 현재 기록에 합칠까요? 같은 주는 백업 내용으로 바뀝니다.'))return;msg.textContent='백업 불러오는 중…';try{let q=query(collection(db,'users',currentUser.uid,'weekly_check_backups'),orderBy('deviceCreatedAt','desc'),limit(1)),s=await getDocs(q);if(s.empty){msg.textContent='아직 만든 백업이 없어요.';return}let records=s.docs[0].data().records||{};for(const [wk,d] of Object.entries(records)){localSet(wk,d);await setDoc(doc(db,'users',currentUser.uid,'weekly_check',wk),{...d,deviceUpdatedAt:Date.now(),updatedAt:serverTimestamp()})}render();msg.textContent=`복원 완료 · ${Object.keys(records).length}주 기록`}catch(e){msg.textContent='복원하지 못했어요.'}};
window.addEventListener('online',()=>{if(currentUser){setSync('재연결 중…');migrateAndPull(currentUser).then(()=>listenCloud(currentUser)).catch(e=>{console.error('Firestore reconnect error',e);setSync('동기화 오류 · 기기에 저장됨')})}});
window.addEventListener('offline',()=>setSync('오프라인 · 기기에 저장됨'));
render();show(sessionStorage.getItem(VIEW)==='archive'?'archive':'week');if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>
